name: check_versions
on:
  workflow_dispatch:
  schedule:
  - cron: 0 0 * * 0     # weekly

permissions: {}

jobs:
  check_pytorch_python_version:
    runs-on: ubuntu-latest
    name: Check pytorch supported python versions
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
    - run: |
        pytorch_version=$(python .github/workflows/check_supported_versions.py pytorch.toml)
        fenestration_version=$(python .github/workflows/check_supported_versions.py pyproject.toml)
        if [[ $pytorch_version != $fenestration_version ]]; then
            echo "PYTORCH SUPPORTED PYTHON VERSIONS CHANGED, update pyproject.toml";
            echo pytorch: $pytorch_version";
            echo fenestration: $fenestration_version";
            exit 1;
        fi
